# Tests Tongs on every push: the detector (Python) and the map drawer and server (Node),
# on Linux and macOS, on the oldest and newest Node versions it supports.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:   # start it by hand from the Actions tab
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
